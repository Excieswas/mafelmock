<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAFELMOCK — USG Paneli</title><meta name="robots" content="noindex"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head><body><div class="wrap">
<nav><a class="logo" href="/">MAFELMOCK</a><span class="mut">USG Paneli</span></nav>
<div id="login" class="panel login"><h2>USG Girişi</h2><label>Komite kodu</label><input id="id"><label>Şifre</label><input type="password" id="pw"><p class="msg" id="lm"></p><button onclick="login()">Giriş yap</button></div>
<div id="app" hidden><div class="panel"><h2 id="t"></h2>
<label>Koltuk (delege) sayısı</label><input id="seats" type="number" min="1" max="300" onchange="rows()">
<label>Gündem</label><input id="agenda"><label>Komite hakkında</label><textarea id="desc"></textarea>
<label>Detaylar (kurallar, dress code, program…)</label><textarea id="det"></textarea>
<label>Study Guide (PDF, en fazla 8MB) <span id="gs" class="pill"></span></label><div class="row"><input type="file" id="f" accept="application/pdf"><button class="ghost" onclick="up()">Yükle</button></div></div>
<div class="panel"><h3>Delege Matrisi</h3><div style="overflow-x:auto"><table class="tbl-in"><thead><tr><th>#</th><th>Ülke / Rol</th><th>Delege</th><th>Okul</th></tr></thead><tbody id="rows"></tbody></table></div></div>
<button onclick="save()">Kaydet</button> <span class="msg ok" id="sm"></span></div></div>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,opt={}){
  const h={...(opt.headers||{})};const t=sessionStorage.getItem('tok');if(t)h.authorization='Bearer '+t;
  if(opt.json){h['content-type']='application/json';opt.body=JSON.stringify(opt.json)}
  const r=await fetch('/api/'+path,{...opt,headers:h});const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(d.error||'Hata');return d}
</script><script>
const $=id=>document.getElementById(id);let M=[];
async function login(){try{const r=await api('login',{method:'POST',json:{role:'usg',id:$('id').value.trim(),password:$('pw').value}});sessionStorage.setItem('tok',r.token);start()}catch(e){$('lm').textContent=e.message}}
async function start(){try{const c=await api('usg/committee');$('login').hidden=true;$('app').hidden=false;
$('t').textContent=c.name;$('seats').value=c.seats;$('agenda').value=c.agenda;$('desc').value=c.description;$('det').value=c.details;
$('gs').textContent=c.hasGuide?'Yüklü':'Yok';M=c.matrix;rows()}catch{sessionStorage.removeItem('tok')}}
function grab(){M=[...document.querySelectorAll('#rows tr')].map(tr=>{const i=tr.querySelectorAll('input');return{country:i[0].value,delegate:i[1].value,school:i[2].value}})}
function rows(){if($('rows').children.length)grab();const n=Math.min(Math.max(+$('seats').value||1,1),300);
$('rows').innerHTML=Array.from({length:n},(_,i)=>{const r=M[i]||{};return `<tr><td>${i+1}</td><td><input value="${esc(r.country)}"></td><td><input value="${esc(r.delegate)}"></td><td><input value="${esc(r.school)}"></td></tr>`}).join('')}
async function save(){grab();try{await api('usg/committee',{method:'PUT',json:{seats:$('seats').value,agenda:$('agenda').value,description:$('desc').value,details:$('det').value,matrix:M}});$('sm').textContent='Kaydedildi ✓'}catch(e){$('sm').textContent=e.message}}
async function up(){const f=$('f').files[0];if(!f)return;const fd=new FormData();fd.append('file',f);try{await api('usg/guide',{method:'POST',body:fd});$('gs').textContent='Yüklü'}catch(e){alert(e.message)}}
if(sessionStorage.getItem('tok'))start();
</script></body></html>
