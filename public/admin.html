<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAFELMOCK — Admin</title><meta name="robots" content="noindex"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head><body><div class="wrap">
<nav><a class="logo" href="/">MAFELMOCK</a><span class="mut">Admin Paneli</span></nav>
<div id="login" class="panel login"><h2 id="lt">Giriş</h2><label>Şifre</label><input type="password" id="pw"><p class="msg" id="lm"></p><button onclick="login()">Giriş yap</button></div>
<div id="app" hidden>
<div class="panel"><h3>Yeni Komite</h3><div class="row" style="margin-top:10px"><input id="n" placeholder="Komite adı"><input id="a" placeholder="Kısaltma (UNSC)"><input id="s" type="number" placeholder="Koltuk" value="20"></div>
<div class="row" style="margin-top:10px"><input id="u" placeholder="USG adı"><input id="p" placeholder="USG şifresi"><button onclick="add()">Ekle</button></div><p class="msg" id="am"></p></div>
<div id="list"></div></div></div>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,opt={}){
  const h={...(opt.headers||{})};const t=sessionStorage.getItem('tok');if(t)h.authorization='Bearer '+t;
  if(opt.json){h['content-type']='application/json';opt.body=JSON.stringify(opt.json)}
  const r=await fetch('/api/'+path,{...opt,headers:h});const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(d.error||'Hata');return d}
</script><script>
const $=id=>document.getElementById(id);let D=[];
async function login(){try{const r=await api('login',{method:'POST',json:{role:'admin',password:$('pw').value}});sessionStorage.setItem('tok',r.token);start()}catch(e){$('lm').textContent=e.message}}
async function start(){try{D=await api('admin/committees');$('login').hidden=true;$('app').hidden=false;draw()}catch{sessionStorage.removeItem('tok')}}
function draw(){$('list').innerHTML=D.map(c=>`<div class="panel"><div class="row"><h3>${esc(c.name)}</h3><span class="pill">kod: ${esc(c.id)}</span><span class="pill">${c.hasGuide?'Guide var':'Guide yok'}</span></div>
<div class="row" style="margin-top:10px"><input id="n_${c.id}" value="${esc(c.name)}"><input id="a_${c.id}" value="${esc(c.abbr)}"><input id="s_${c.id}" type="number" value="${c.seats}"><input id="u_${c.id}" value="${esc(c.usg)}" placeholder="USG"></div>
<div class="row" style="margin-top:10px"><input id="p_${c.id}" placeholder="Yeni şifre (boş = değişmez)"><label style="margin:0;display:flex;gap:8px;align-items:center;color:var(--tx)"><input type="checkbox" id="v_${c.id}" ${c.visible?'checked':''} style="width:auto"> Public görünür</label>
<button onclick="save('${c.id}')">Kaydet</button><button class="danger" onclick="del('${c.id}')">Sil</button></div></div>`).join('')||'<p class="mut">Komite yok.</p>'}
async function add(){try{await api('admin/committees',{method:'POST',json:{name:$('n').value,abbr:$('a').value,seats:$('s').value,usg:$('u').value,password:$('p').value}});['n','a','u','p'].forEach(i=>$(i).value='');$('am').textContent='';start()}catch(e){$('am').textContent=e.message}}
async function save(id){const g=k=>$(k+'_'+id);await api('admin/committees/'+id,{method:'PUT',json:{name:g('n').value,abbr:g('a').value,seats:g('s').value,usg:g('u').value,password:g('p').value,visible:g('v').checked}});start()}
async function del(id){if(confirm('Komite silinsin mi?')){await api('admin/committees/'+id,{method:'DELETE'});start()}}
api('status').then(s=>{if(!s.adminSet)$('lt').textContent='İlk kurulum: admin şifreni belirle'}).catch(e=>$('lm').textContent=e.message);
if(sessionStorage.getItem('tok'))start();
</script></body></html>
