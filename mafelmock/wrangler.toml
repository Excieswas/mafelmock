name = "mafelmock"
main = "src/worker.js"
compatibility_date = "2024-11-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# database_id yazmana gerek yok: wrangler deploy veritabanını otomatik oluşturur.
[[d1_databases]]
binding = "DB"
database_name = "mafelmock"
